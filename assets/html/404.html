<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 • Lost in the Void</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Space Grotesk',sans-serif;
    background:#05070d;
    color:#fff;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(0,140,255,.12),transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.03),transparent 70%);
}

.grid{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:45px 45px;
    transform:perspective(800px) rotateX(70deg);
    transform-origin:top;
    opacity:.25;
}

.container{
    position:relative;
    z-index:5;
    text-align:center;
    max-width:750px;
    padding:40px;
}

.code{
    font-size:9rem;
    font-weight:700;
    color:#5ce1ff;
    text-shadow:
        0 0 20px #00d9ff,
        0 0 60px #00bfff;
    animation:flicker 3s infinite;
}

.subtitle{
    margin-top:-10px;
    font-size:2rem;
    font-weight:600;
}

.text{
    margin:20px auto;
    color:#a7b5c9;
    line-height:1.8;
    max-width:550px;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:10px 18px;
    border:1px solid rgba(92,225,255,.4);
    border-radius:999px;
    color:#5ce1ff;
    background:rgba(92,225,255,.08);
    font-size:.9rem;
}

.actions{
    margin-top:40px;
}

a{
    display:inline-block;
    margin:10px;
    text-decoration:none;
    padding:14px 28px;
    border-radius:12px;
    transition:.3s;
    font-weight:600;
}

.home{
    background:#5ce1ff;
    color:#061018;
}

.home:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(92,225,255,.45);
}

.back{
    border:1px solid rgba(255,255,255,.15);
    color:white;
}

.back:hover{
    background:rgba(255,255,255,.05);
}

.footer{
    margin-top:40px;
    font-size:.8rem;
    color:#70819b;
}

@keyframes flicker{
    0%,100%{
        opacity:1;
    }
    48%{
        opacity:.95;
    }
    50%{
        opacity:.6;
    }
    52%{
        opacity:1;
    }
}

@media(max-width:700px){

.code{
    font-size:6rem;
}

.subtitle{
    font-size:1.5rem;
}

.text{
    font-size:.95rem;
}

}
</style>
  <link rel="icon" type="image/png" href="/assets/png/logowhiteexploitx.png?v=2">
</head>

<body>

<div class="grid"></div>

<div class="container">

<div class="code">404</div>

<div class="subtitle">
Lost in the Void
</div>

<p class="text">
The page you're looking for doesn't exist, has been moved,
or was never deployed to this dimension.
</p>

<div class="badge">
We'd love to help you, but unfortunately, we can't.
</div>

<div class="actions">
<a href="/assets/html/home.html" class="home">Return Home</a>
<a href="javascript:history.back()" class="back">Go Back</a>
</div>

<div class="footer">
ExploitX • Into the Void
</div>

</div>

</body>

</html>
